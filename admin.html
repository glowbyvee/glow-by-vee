<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glow Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
    <aside class="w-64 min-h-screen bg-[#1A1A1B] text-white p-6">
        <h1 class="text-[#FF007F] font-bold text-2xl mb-10">Vee's Portal</h1>
        <nav class="space-y-6">
            <div class="text-[#D4AF37]">ORDERS</div>
            <div>INVENTORY</div>
            <div>CUSTOMERS</div>
            <div>SHIPPING</div>
        </nav>
    </aside>

    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold">Incoming Orders</h2>
            <button class="bg-[#FF007F] text-white px-6 py-2 rounded-full">+ ADD PRODUCT</button>
        </header>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-pink-50 border-b">
                    <tr>
                        <th class="p-4 text-[#FF007F]">Order ID</th>
                        <th class="p-4">Customer</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Location</th>
                        <th class="p-4">Payment</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b">
                        <td class="p-4 font-mono font-bold">#GV-8812</td>
                        <td class="p-4">Millie Daniels</td>
                        <td class="p-4"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs">Delivered</span></td>
                        <td class="p-4">Nairobi, Kenya</td>
                        <td class="p-4">M-Pesa</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
