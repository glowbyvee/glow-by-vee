<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Admin Portal | Queen's Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --fuchsia: #FF007F; --gold: #D4AF37; }
        body { font-family: 'Inter', sans-serif; }
        .royal-font { font-family: 'Cinzel', serif; }
        .bg-glow-gradient { background: linear-gradient(135deg, var(--fuchsia), var(--gold)); }
        .hidden { display: none !important; }
        .loader { border-top-color: #FF007F; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Glass Effect */
        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="auth-overlay" class="fixed inset-0 bg-[#1A1A1B] z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[40px] p-10 shadow-2xl text-center">
            <div class="h-16 w-16 bg-no-repeat bg-contain mx-auto mb-6" style="background-image: url('logo.jpg');"></div>
            <h2 class="royal-font text-2xl text-[#FF007F] mb-2" id="auth-title">Admin Login</h2>
            <p class="text-gray-400 text-xs mb-8 uppercase tracking-widest">Access restricted to Glow Royalty</p>

            <form id="auth-form" class="space-y-4">
                <input id="auth-email" type="email" placeholder="Email Address" required class="w-full border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-[#FF007F]">
                <input id="auth-name" type="text" placeholder="Your Full Name" class="hidden w-full border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-[#FF007F]">
                <input id="auth-password" type="password" placeholder="Password" required class="w-full border-2 border-gray-100 rounded-2xl p-4 outline-none focus:border-[#FF007F]">
                <div class="relative">
                    <input id="master-key" type="password" placeholder="Master Admin Secret Key" required class="w-full border-2 border-[#D4AF37] rounded-2xl p-4 outline-none bg-yellow-50/30">
                    <p class="text-[10px] text-[#D4AF37] font-bold mt-1 text-left px-2 uppercase">Required for security</p>
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-glow-gradient py-4 rounded-2xl font-bold text-white shadow-lg mt-4 flex justify-center items-center">
                    <span id="btn-text">ENTER PORTAL</span>
                </button>
            </form>

            <div class="mt-6 flex flex-col gap-2">
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-xs font-bold text-gray-400 hover:text-[#FF007F]">Need to register a new admin?</button>
            </div>
        </div>
    </div>

    <div id="dashboard-content" class="hidden flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-64 bg-[#1A1A1B] text-white p-6 md:sticky md:top-0 md:h-screen">
            <div class="flex items-center gap-2 mb-10">
                <div class="h-10 w-10 bg-no-repeat bg-contain" style="background-image: url('logo.jpg'); filter: invert(1);"></div>
                <h1 class="text-[#FF007F] font-bold text-xl royal-font">Vee's Portal</h1>
            </div>
            <div id="admin-info" class="mb-6 p-3 bg-white/5 rounded-xl border border-white/10">
                <p class="text-[10px] text-[#D4AF37] uppercase font-bold">Logged in as:</p>
                <p id="current-admin-name" class="text-sm font-bold truncate">Admin Name</p>
            </div>
            <nav class="space-y-2">
                <a href="#" class="block p-3 rounded-xl bg-[#FF007F]/10 text-[#FF007F] font-bold">OVERVIEW</a>
                <a href="#" class="block p-3 rounded-xl hover:bg-white/5 transition-all text-[#D4AF37]">ORDERS</a>
                <button onclick="logout()" class="w-full text-left p-3 rounded-xl hover:bg-red-500/10 text-red-400 transition-all">LOGOUT</button>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
             <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
                <h2 class="text-3xl font-bold text-gray-800">Order Fulfillment</h2>
                <div class="flex gap-3">
                    <button onclick="toggleModal('category-modal')" class="border-2 border-[#D4AF37] text-[#D4AF37] px-6 py-2 rounded-full font-bold text-sm hover:bg-[#D4AF37] hover:text-white transition-all">ADD CATEGORY</button>
                    <button onclick="openProductModal()" class="bg-[#FF007F] text-white px-6 py-2 rounded-full font-bold text-sm shadow-lg hover:opacity-90 transition-all">+ ADD PRODUCT</button>
                </div>
            </header>

            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                <div class="p-5 border-b font-bold royal-font text-[#FF007F]">Recent Orders</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-pink-50/50 border-b">
                            <tr>
                                <th class="p-5 text-sm font-bold">Order ID</th>
                                <th class="p-5 text-sm font-bold">Customer</th>
                                <th class="p-5 text-sm font-bold">Date</th>
                                <th class="p-5 text-sm font-bold">Status</th>
                                <th class="p-5 text-sm font-bold">Payment</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="text-gray-600">
                            <tr><td colspan="5" class="p-10 text-center">Ready for operations...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="category-modal" class="hidden fixed inset-0 z-[110] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h3 class="royal-font text-xl text-[#FF007F] mb-6">New Category</h3>
            <form id="category-form" class="space-y-4">
                <input type="text" id="cat-name" placeholder="Category Name (e.g., Skincare)" required class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]">
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="toggleModal('category-modal')" class="flex-1 py-3 text-gray-400 font-bold">CANCEL</button>
                    <button type="submit" class="flex-1 bg-glow-gradient py-3 rounded-xl font-bold text-white shadow-lg">SAVE</button>
                </div>
            </form>
        </div>
    </div>

    <div id="product-modal" class="hidden fixed inset-0 z-[110] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="royal-font text-xl text-[#FF007F] mb-6">Add New Product</h3>
            <form id="product-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="prod-name" placeholder="Product Name" required class="border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]">
                    <select id="prod-category" required class="border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]">
                        <option value="">Select Category</option>
                    </select>
                </div>
                <textarea id="prod-desc" placeholder="Product Description" rows="3" required class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]"></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="prod-price" placeholder="Price (KES)" required class="border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]">
                    <input type="number" id="prod-stock" placeholder="Stock Quantity" required class="border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-[#FF007F]">
                </div>
                <div class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center">
                    <input type="file" id="prod-image" accept="image/*" required class="hidden">
                    <label for="prod-image" class="cursor-pointer">
                        <div class="text-[#D4AF37] font-bold">Click to Upload Product Image</div>
                        <div id="file-name" class="text-xs text-gray-400 mt-1 italic">No file chosen</div>
                    </label>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="toggleModal('product-modal')" class="flex-1 py-3 text-gray-400 font-bold">CANCEL</button>
                    <button type="submit" id="prod-save-btn" class="flex-1 bg-glow-gradient py-3 rounded-xl font-bold text-white shadow-lg">PUBLISH PRODUCT</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://znanyxsycuhhykciwigi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VoaHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MASTER_ADMIN_KEY = "GLOW_QUEEN_2026_SECURE"; 
        let isRegistering = false;

        // UI HELPERS
        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        // File name preview
        document.getElementById('prod-image').onchange = function() {
            document.getElementById('file-name').innerText = this.files[0]?.name || "No file chosen";
        };

        // CATEGORY LOGIC
        document.getElementById('category-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('cat-name').value;
            try {
                const { error } = await _supabase.from('categories').insert([{ name }]);
                if (error) throw error;
                alert("✅ Category Saved!");
                toggleModal('category-modal');
                e.target.reset();
                location.reload(); 
            } catch (err) { alert("Error: " + err.message); }
        };

        // PRODUCT LOGIC
        async function openProductModal() {
            const select = document.getElementById('prod-category');
            select.innerHTML = '<option value="">Loading categories...</option>';
            toggleModal('product-modal');
            
            const { data } = await _supabase.from('categories').select('*');
            select.innerHTML = '<option value="">Select Category</option>';
            data?.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('prod-save-btn');
            btn.innerText = "UPLOADING...";
            btn.disabled = true;

            const file = document.getElementById('prod-image').files[0];
            const fileName = `${Date.now()}_${file.name}`;

            try {
                // 1. Upload Image to Storage bucket
                const { data: imgData, error: imgErr } = await _supabase.storage
                    .from('product-images')
                    .upload(fileName, file);
                if (imgErr) throw imgErr;

                // 2. Get the Public URL for display
                const { data: urlData } = _supabase.storage.from('product-images').getPublicUrl(fileName);

                // 3. Insert to Products Table (Ensuring 'stock' column is included)
                const { error: prodErr } = await _supabase.from('products').insert([{
                    name: document.getElementById('prod-name').value,
                    category_id: document.getElementById('prod-category').value,
                    description: document.getElementById('prod-desc').value,
                    price: parseFloat(document.getElementById('prod-price').value),
                    stock: parseInt(document.getElementById('prod-stock').value),
                    image_url: urlData.publicUrl,
                    img: fileName 
                }]);

                if (prodErr) throw prodErr;

                alert("✅ Product Published Successfully!");
                toggleModal('product-modal');
                e.target.reset();
                await logActivity('ADD_PRODUCT', `Added ${document.getElementById('prod-name').value}`);
                location.reload();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = "PUBLISH PRODUCT";
                btn.disabled = false;
            }
        };

        // AUTH & SESSION
        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? "Register Admin" : "Admin Login";
            document.getElementById('auth-name').classList.toggle('hidden', !isRegistering);
            document.getElementById('btn-text').innerText = isRegistering ? "CREATE ACCOUNT" : "ENTER PORTAL";
            document.getElementById('toggle-auth-btn').innerText = isRegistering ? "Back to Login" : "Need to register a new admin?";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('auth-btn');
            const btnText = document.getElementById('btn-text');
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const fullName = document.getElementById('auth-name').value;
            if (document.getElementById('master-key').value !== MASTER_ADMIN_KEY) {
                alert("❌ INVALID MASTER SECRET KEY."); return;
            }
            btn.disabled = true;
            btnText.innerText = "PROCESSING...";
            try {
                if (isRegistering) {
                    const { data, error } = await _supabase.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
                    if (error) throw error;
                    alert("✅ Admin created! Log in now.");
                    toggleAuthMode();
                } else {
                    const { error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    await checkSession();
                }
            } catch (err) { alert("❌ Error: " + err.message); }
            finally { btn.disabled = false; btnText.innerText = isRegistering ? "CREATE ACCOUNT" : "ENTER PORTAL"; }
        }

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('current-admin-name').innerText = session.user.user_metadata.full_name || "Admin";
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
                document.getElementById('dashboard-content').classList.add('hidden');
            }
        }

        async function logActivity(action, details) {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return;
            await _supabase.from('admin_logs').insert([{
                admin_id: user.id, admin_name: user.user_metadata.full_name || 'Admin',
                action, details, created_at: new Date()
            }]);
        }

        async function logout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        document.getElementById('auth-form').onsubmit = handleAuth;
        window.onload = checkSession;
    </script>
</body>
</html>
