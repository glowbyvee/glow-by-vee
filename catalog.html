<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Collection | Glow by Vee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --fuchsia: #FF007F; --gold: #D4AF37; }
        body { font-family: 'Inter', sans-serif; background-color: #fff; }
        .royal-font { font-family: 'Cinzel', serif; }
        .category-btn.active { background-color: var(--fuchsia); color: white; border-color: var(--fuchsia); box-shadow: 0 4px 12px rgba(255, 0, 127, 0.2); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="bg-white">

    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <h2 class="royal-font text-3xl md:text-5xl text-[#FF007F] mb-8 text-center">Royal Collection</h2>
        
        <div id="category-bar" class="flex flex-wrap gap-3 mb-12 justify-center">
            <button id="btn-all" onclick="filterProducts('All', this)" 
                class="category-btn active border-2 border-gray-100 px-8 py-3 rounded-full text-xs font-black uppercase tracking-widest transition-all">
                All Collections
            </button>
        </div>

        <div id="loading-spinner" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-[#FF007F] mb-4"></div>
            <p class="text-gray-400 italic royal-font tracking-widest">Refreshing Royal Stocks...</p>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-10">
            </div>
    </main>

    <script>
        const SUPABASE_URL = "https://znanyxsycuhhykciwigi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VoaHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let allCategories = [];

        async function initializeCatalog() {
            // 1. Fetch both simultaneously to ensure data integrity
            const [catRes, prodRes] = await Promise.all([
                _supabase.from('categories').select('*').order('name'),
                _supabase.from('products').select('*, categories(name)')
            ]);

            allCategories = catRes.data || [];
            allProducts = prodRes.data || [];

            renderCategoryBar();
            renderProducts(allProducts);
            document.getElementById('loading-spinner').classList.add('hidden');

            // 2. Enable Real-time sync
            setupRealtime();
        }

        function setupRealtime() {
            _supabase.channel('catalog-updates')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, async () => {
                    const { data } = await _supabase.from('products').select('*, categories(name)');
                    allProducts = data;
                    renderProducts(allProducts);
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, async () => {
                    const { data } = await _supabase.from('categories').select('*').order('name');
                    allCategories = data;
                    renderCategoryBar();
                })
                .subscribe();
        }

        function renderCategoryBar() {
            const bar = document.getElementById('category-bar');
            // Reset to keep the "All" button
            bar.innerHTML = `<button id="btn-all" onclick="filterProducts('All', this)" class="category-btn active border-2 border-gray-100 px-8 py-3 rounded-full text-xs font-black uppercase tracking-widest transition-all">All Collections</button>`;
            
            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "category-btn border-2 border-gray-100 px-8 py-3 rounded-full text-xs font-black uppercase tracking-widest transition-all hover:border-[#FF007F]";
                btn.innerText = cat.name;
                btn.onclick = (e) => filterProducts(cat.name, e.target);
                bar.appendChild(btn);
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 bg-gray-50 rounded-[40px] border-2 border-dashed border-gray-100">
                    <p class="text-gray-400 italic">No royal products found in this section.</p>
                </div>`;
                return;
            }

            grid.innerHTML = items.map(p => {
                const img = p.image_url || 'https://via.placeholder.com/400?text=Glow+Coming+Soon';
                const catName = p.categories?.name || 'General';

                return `
                    <div class="product-card group bg-white border border-pink-50 rounded-[40px] p-4 shadow-sm hover:shadow-2xl hover:-translate-y-2">
                        <div class="relative aspect-square rounded-[30px] overflow-hidden mb-5 bg-gray-50">
                            <img src="${img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
                            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-4 py-1 rounded-full border border-pink-100">
                                <span class="text-[9px] font-black text-[#FF007F] uppercase tracking-tighter">${catName}</span>
                            </div>
                        </div>
                        
                        <h3 class="royal-font text-lg font-bold text-gray-800 mb-1 px-2">${p.name}</h3>
                        <p class="text-xs text-gray-400 line-clamp-2 px-2 mb-6 font-medium">${p.description || ''}</p>
                        
                        <div class="flex items-center justify-between bg-pink-50/30 p-4 rounded-[25px]">
                            <div>
                                <p class="text-[9px] uppercase font-bold text-gray-400 tracking-widest">Price</p>
                                <p class="text-[#FF007F] font-black text-xl">KES ${p.price.toLocaleString()}</p>
                            </div>
                            <button onclick="addToCart('${p.id}')" class="bg-[#D4AF37] hover:bg-[#FF007F] text-white p-4 rounded-2xl transition-all shadow-lg active:scale-90">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterProducts(categoryName, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (categoryName === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.categories?.name === categoryName);
                renderProducts(filtered);
            }
        }

        function addToCart(id) {
            // Placeholder for your cart logic
            alert("This royal item has been added to your selection.");
        }

        window.onload = initializeCatalog;
    </script>
</body>
</html>
