<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow By Vee | Royal Skincare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --fuchsia: #FF007F; --gold: #D4AF37; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .royal-font { font-family: 'Cinzel', serif; }
        .bg-glow-gradient { background: linear-gradient(135deg, var(--fuchsia), var(--gold)); }
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-white">

    <section class="relative h-[80vh] flex items-center justify-center text-center text-white overflow-hidden">
        <div class="absolute inset-0 bg-black/40 z-10"></div>
        <img src="hero-bg.jpg" class="absolute inset-0 w-full h-full object-cover" alt="Hero Background">
        <div class="relative z-20 px-4">
            <h1 class="royal-font text-5xl md:text-7xl mb-4">REVEAL YOUR<br><span class="text-[#FF007F]">INNER RADIANCE</span></h1>
            <p class="text-lg md:text-xl mb-8 italic">Your skin, your goals, our science.</p>
            <a href="#collections-section" class="bg-glow-gradient px-10 py-4 rounded-full font-bold text-lg shadow-xl hover:scale-105 transition-transform inline-block">EXPLORE CATALOG</a>
        </div>
    </section>

    <section id="collections-section" class="py-20 px-4 max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <h2 class="royal-font text-4xl text-[#D4AF37] mb-2">Glow By Vee's Collections</h2>
            <div class="w-24 h-1 bg-[#FF007F] mx-auto mb-8"></div>
            <p class="text-gray-500 italic uppercase tracking-widest text-sm">Browse Individual Elixirs</p>
        </div>

        <div id="category-filters" class="flex flex-wrap justify-center gap-4 mb-12">
            <button onclick="filterProducts('All')" class="px-6 py-2 rounded-full border-2 border-[#FF007F] text-[#FF007F] font-bold hover:bg-[#FF007F] hover:text-white transition-all">All</button>
        </div>

        <div id="product-display-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="col-span-full text-center py-10">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-[#FF007F]"></div>
                <p class="mt-4 text-gray-400">Opening the Royal Vault...</p>
            </div>
        </div>
    </section>

    <section class="bg-[#1A1A1B] text-white py-16 px-4 text-center">
        <h2 class="royal-font text-3xl text-[#D4AF37] mb-4">Royal AI Skin Analysis</h2>
        <p class="mb-8 text-gray-400 max-w-2xl mx-auto">Stop guessing your skincare routine. Our advanced AI scans your unique skin profile.</p>
        <button class="border-2 border-[#D4AF37] text-[#D4AF37] px-8 py-3 rounded-full font-bold hover:bg-[#D4AF37] hover:text-black transition-all">START FREE SCAN</button>
    </section>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://znanyxsycuhhykciwigi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VoaHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // UPDATE: Load Products Dynamically
        async function loadGlowProducts() {
            const displayGrid = document.getElementById('product-display-grid');
            const filterContainer = document.getElementById('category-filters');
            
            try {
                // 1. Fetch products
                const { data: products, error } = await _supabase.from('products').select('*');
                if (error) throw error;

                if (!products || products.length === 0) {
                    displayGrid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">No products available in the collection yet.</div>';
                    return;
                }

                // 2. Clear loader
                displayGrid.innerHTML = '';

                // 3. Render Product Cards
                products.forEach(product => {
                    const { data: publicUrlData } = _supabase.storage.from('product-images').getPublicUrl(product.img);
                    const imageUrl = publicUrlData.publicUrl;

                    const productCard = `
                        <div class="product-card bg-white rounded-3xl overflow-hidden shadow-lg border border-gray-100 group" data-category="${product.category}">
                            <div class="relative h-72 overflow-hidden">
                                <img src="${imageUrl}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                                <div class="absolute top-4 right-4 bg-white/90 px-3 py-1 rounded-full text-xs font-bold text-[#D4AF37] shadow-sm">${product.category}</div>
                            </div>
                            <div class="p-6 text-center">
                                <h3 class="royal-font text-xl text-gray-800 mb-2">${product.name}</h3>
                                <p class="text-gray-500 text-sm mb-4 line-clamp-2">${product.description || 'Premium Royal Formulation'}</p>
                                <div class="text-[#FF007F] font-bold text-lg mb-4">KES ${parseFloat(product.price).toLocaleString()}</div>
                                <button class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-[#FF007F] transition-colors">ADD TO BAG</button>
                            </div>
                        </div>
                    `;
                    displayGrid.innerHTML += productCard;

                    // Add unique categories to filters
                    if (!document.querySelector(`button[onclick="filterProducts('${product.category}')"]`)) {
                        const catBtn = document.createElement('button');
                        catBtn.className = "px-6 py-2 rounded-full border-2 border-gray-200 text-gray-500 font-bold hover:border-[#FF007F] hover:text-[#FF007F] transition-all";
                        catBtn.innerText = product.category;
                        catBtn.onclick = () => filterProducts(product.category);
                        filterContainer.appendChild(catBtn);
                    }
                });

            } catch (err) {
                console.error("Fetch error:", err);
                displayGrid.innerHTML = `<div class="col-span-full text-center text-red-500">Error loading collections: ${err.message}</div>`;
            }
        }

        // UPDATE: Integrated saveProduct function
        async function saveProduct() {
            const name = document.getElementById('p-name').value;
            const categoryName = document.getElementById('p-category').value; 
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const file = document.getElementById('p-image').files[0];

            if (!file) return alert("Please upload a product image!");

            try {
                const fileName = `${Date.now()}_${file.name}`;
                const { data: storageData, error: storageError } = await _supabase.storage
                    .from('product-images')
                    .upload(fileName, file);

                if (storageError) throw storageError;

                const { error: dbError } = await _supabase
                    .from('products')
                    .insert([{
                        name: name,
                        category: categoryName, 
                        price: parseFloat(price),
                        description: desc,
                        img: fileName 
                    }]);

                if (!dbError) {
                    alert("👑 Royal Product Added Successfully!");
                    location.reload(); 
                } else {
                    throw dbError;
                }
            } catch (err) {
                alert("Vault Error: " + err.message);
            }
        }

        function filterProducts(cat) {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                card.style.display = (cat === 'All' || card.dataset.category === cat) ? 'block' : 'none';
            });
        }

        window.onload = loadGlowProducts;
    </script>
</body>
</html>
