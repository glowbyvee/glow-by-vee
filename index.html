<style>
    .description-box { border: 2px solid #FF007F; padding: 15px; border-radius: 15px; max-height: 120px; overflow-y: auto; margin-bottom: 10px; }
    .review-box { border: 1px solid #ddd; padding: 10px; border-radius: 10px; background: #fffafb; margin-top: 10px; }
    .payment-sticker { cursor: pointer; transition: transform 0.2s; border: 3px solid transparent; border-radius: 15px; }
    .payment-sticker:hover { transform: scale(1.05); }
    .payment-sticker.selected { border-color: #FF007F; background: #fff1f2; }
    .star-rating { color: #D4AF37; font-size: 1.2rem; }
    .progress-container { width: 100%; background: #eee; border-radius: 20px; height: 25px; position: relative; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #FF007F, #D4AF37); border-radius: 20px; transition: width 0.5s; }
</style>

<body>
<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<nav class="sticky top-0 bg-white z-[150] shadow-xl border-b-8 border-[#FF007F]">
    <div class="flex justify-between items-center px-6 py-4 md:px-16">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <div class="h-10 w-10 md:h-14 md:w-14 bg-contain bg-no-repeat" style="background-image: url('logo.jpg');"></div>
            <span class="royal-font text-xl md:text-4xl font-black text-[#FF007F]">Glow By Vee</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <span class="text-3xl md:text-4xl">🛒</span><span id="cart-counter">0</span>
            </div>
        </div>
    </div>
    <div class="flex justify-center overflow-x-auto gap-8 px-6 py-3 bg-pink-50 border-t border-pink-100 no-scrollbar items-center">
        <a href="#catalog" onclick="closeModules()" class="nav-link">SHOP</a>
        <button onclick="openModule('about-module')" class="nav-link">ABOUT US</button>
        <button onclick="openCustomerPortal()" class="nav-link text-[#FF007F]">PORTAL</button>
        <button onclick="openModule('delivery-auth-module')" class="nav-link">ORDER DELIVERY</button>
        <button onclick="accessAdmin()" class="nav-link">ADMIN</button>
    </div>
</nav>

<div id="product-modal" class="modal-overlay fixed inset-0 items-center justify-center p-4">
    <div class="bg-white rounded-[40px] max-w-5xl w-full p-8 overflow-y-auto max-h-[95vh] relative shadow-2xl">
        <button onclick="closeProductModal()" class="absolute top-6 right-6 text-3xl">&times;</button>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <img id="modal-img" class="w-full aspect-square rounded-3xl object-cover">
            <div>
                <h2 id="modal-title" class="royal-font text-4xl text-[#C2185B] mb-4"></h2>
                <div class="description-box">
                    <p id="modal-desc" class="text-gray-600 italic"></p>
                </div>
                <p id="modal-price" class="text-3xl font-black text-[#FF007F] mb-6"></p>
                
                <h4 class="font-bold border-b pb-2 mb-2">Customer Reviews</h4>
                <div id="modal-reviews" class="max-height-[200px] overflow-y-auto mb-4">
                    </div>

                <button id="modal-add-btn" class="glow-button w-full py-5 rounded-2xl text-white font-black">ADD TO CART</button>
            </div>
        </div>
    </div>
</div>

<div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white shadow-2xl flex flex-col border-l-[8px] border-[#FF007F]">
    <div class="p-8 border-b-2 flex justify-between items-center">
        <h2 class="royal-font text-3xl text-[#FF007F]">Your Bag</h2>
        <button onclick="toggleCart()" class="text-5xl text-gray-300">&times;</button>
    </div>
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-8 space-y-4"></div>
    <div class="p-8 border-t-2">
        <div class="flex justify-between font-black text-2xl mb-6"><span>Total</span><span id="cart-total-val" class="text-[#FF007F]">KES 0</span></div>
        <button id="checkout-main-btn" onclick="showCheckoutForm()" class="w-full py-5 rounded-2xl bg-[#FF007F] text-white font-black uppercase text-xl shadow-lg">CHECKOUT</button>
        
        <div id="checkout-form-step" class="hidden space-y-4 mt-4">
            <input id="checkout-phone" type="text" onblur="validateUser()" placeholder="Enter Mobile Number" class="w-full p-4 border rounded-xl">
            <div id="auto-reg-fields" class="hidden">
                <input id="checkout-name" type="text" placeholder="Full Name" class="w-full p-4 border rounded-xl bg-pink-50">
            </div>
            
            <div class="grid grid-cols-2 gap-4 py-4">
                <div onclick="selectPayment('Online')" class="payment-sticker p-4 text-center bg-blue-50" id="pay-online">
                    <span class="text-3xl">💳</span><p class="font-bold text-xs">Pay Online</p>
                </div>
                <div onclick="selectPayment('POD')" class="payment-sticker p-4 text-center bg-green-50" id="pay-pod">
                    <span class="text-3xl">🚚</span><p class="font-bold text-xs">Pay on Delivery</p>
                </div>
            </div>
            <button onclick="executeFinalOrder()" class="glow-button w-full py-4 rounded-xl text-white font-bold">PLACE ORDER</button>
        </div>
    </div>
</div>

<div id="portal-module" class="full-screen-module px-6">
    <div class="close-module" onclick="closeModules()">&times;</div>
    <div class="max-w-6xl mx-auto py-10">
        <h2 class="royal-font text-4xl text-[#C2185B] mb-8 text-center">Customer Portal</h2>
        <div class="flex gap-4 justify-center mb-8 overflow-x-auto p-2 border-b">
            <button onclick="loadTab('open')" class="portal-tab-btn active p-4 font-bold">Open Orders</button>
            <button onclick="loadTab('processed')" class="portal-tab-btn p-4 font-bold">Processed</button>
            <button onclick="loadTab('tracking')" class="portal-tab-btn p-4 font-bold">Live Tracking</button>
            <button onclick="loadTab('delivered')" class="portal-tab-btn p-4 font-bold">Delivered Orders</button>
        </div>
        <div id="portal-content" class="bg-white rounded-3xl shadow-xl p-8 min-h-[400px]"></div>
    </div>
</div>

<div id="delivery-auth-module" class="full-screen-module px-6">
    <div class="close-module" onclick="closeModules()">&times;</div>
    <div class="max-w-md mx-auto py-20 text-center">
        <h2 class="royal-font text-3xl mb-8">Rider Access</h2>
        <input id="rider-login-name" type="text" placeholder="Name" class="w-full p-4 border rounded-xl mb-4">
        <input id="rider-login-pass" type="password" placeholder="Rider Key" class="w-full p-4 border rounded-xl mb-4">
        <button onclick="riderLogin()" class="glow-button w-full py-4 text-white font-bold rounded-xl">Access Account</button>
    </div>
</div>

<div id="rider-dashboard" class="full-screen-module px-6">
    <div class="close-module" onclick="closeModules()">&times;</div>
    <div class="max-w-6xl mx-auto py-10">
        <h2 id="rider-greeting" class="royal-font text-3xl mb-6"></h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-3xl shadow border">
                <p class="text-xs font-bold text-gray-400">YOUR PROGRESS</p>
                <div class="progress-container mt-2"><div id="rider-progress" class="progress-bar" style="width: 0%"></div></div>
                <p id="rider-recommendation" class="text-[10px] mt-2 text-pink-500 italic"></p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow border">
                <canvas id="riderPerformanceChart" height="100"></canvas>
            </div>
        </div>
        <div class="flex gap-4 mb-6">
            <button onclick="loadRiderOrders('processed')" class="p-2 border-b-2 border-pink-500 font-bold">To Deliver</button>
            <button onclick="loadRiderOrders('delivered')" class="p-2 font-bold text-gray-400">History</button>
            <button onclick="openRiderReturns()" class="p-2 font-bold text-red-400">Returns</button>
        </div>
        <div id="rider-list-container" class="space-y-4"></div>
    </div>
</div>

<div id="admin-panel" class="full-screen-module p-6">
    <div class="close-module" onclick="closeModules()">&times;</div>
    <div class="max-w-7xl mx-auto">
        <h1 class="royal-font text-4xl mb-10 text-[#C2185B]">Queen's Control Center</h1>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-10">
            <button onclick="adminShow('products')" class="p-4 bg-gray-50 rounded-2xl shadow-sm font-bold text-sm">Inventory</button>
            <button onclick="adminShow('riders')" class="p-4 bg-gray-50 rounded-2xl shadow-sm font-bold text-sm">Delivery Team</button>
            <button onclick="adminShow('orders')" class="p-4 bg-gray-50 rounded-2xl shadow-sm font-bold text-sm">Orders</button>
            <button onclick="adminShow('analytics')" class="p-4 bg-gray-50 rounded-2xl shadow-sm font-bold text-sm">Analytics</button>
            <button onclick="adminShow('reports')" class="p-4 bg-gray-50 rounded-2xl shadow-sm font-bold text-sm">Reports</button>
        </div>
        <div id="admin-main-view" class="bg-white p-8 rounded-[40px] shadow-2xl min-h-[600px] overflow-x-auto"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://znanyxsycuhhykciwigi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VoaHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentCustomer = null;
    let selectedPayment = 'POD';
    let currentRider = null;

    // --- CHECKOUT LOGIC ---
    function showCheckoutForm() {
        if(cart.length === 0) return alert("Add items to your bag first!");
        document.getElementById('checkout-main-btn').classList.add('hidden');
        document.getElementById('checkout-form-step').classList.remove('hidden');
    }

    async function validateUser() {
        const phone = document.getElementById('checkout-phone').value;
        if(!phone) return;
        const { data } = await _supabase.from('profiles').select('*').eq('phone_number', phone).single();
        if(data) {
            currentCustomer = data;
            document.getElementById('auto-reg-fields').classList.add('hidden');
        } else {
            document.getElementById('auto-reg-fields').classList.remove('hidden');
        }
    }

    function selectPayment(m) {
        selectedPayment = m;
        document.querySelectorAll('.payment-sticker').forEach(s => s.classList.remove('selected'));
        document.getElementById(`pay-${m.toLowerCase()}`).classList.add('selected');
    }

    async function executeFinalOrder() {
        const phone = document.getElementById('checkout-phone').value;
        const nameInput = document.getElementById('checkout-name').value;
        
        if(!currentCustomer) {
            const { data, error } = await _supabase.from('profiles').insert([{ 
                full_name: nameInput, 
                phone_number: phone, 
                role: 'customer' 
            }]).select().single();
            currentCustomer = data;
        }

        const receipt = "GV-" + Math.floor(Math.random() * 899999 + 100000);
        const { error } = await _supabase.from('orders').insert([{
            customer_id: currentCustomer.id,
            receipt_number: receipt,
            items_description: cart.map(i => i.name).join(', '),
            total_amount: cart.reduce((s, i) => s + i.price, 0),
            payment_method: selectedPayment,
            status: 'open'
        }]);

        if(!error) {
            playNotif();
            showToast("🛒", "Order Placed!", `Receipt: ${receipt}`);
            cart = []; updateCartUI(); toggleCart();
            openCustomerPortal();
        }
    }

    // --- RIDER GPS & TRACKING ---
    function initLiveTracking(riderId) {
        const map = L.map('live-map').setView([-1.286389, 36.817223], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let riderMarker;
        _supabase.channel('rider-location')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${riderId}` }, payload => {
                const { lat, lng } = payload.new;
                if(riderMarker) map.removeLayer(riderMarker);
                riderMarker = L.marker([lat, lng]).addTo(map).bindPopup("Your Glow is approaching!").openPopup();
                map.panTo([lat, lng]);
            }).subscribe();
    }

    // --- ADMIN ANALYTICS ---
    function renderAdminCharts() {
        const ctx = document.getElementById('adminMainChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Sales', 'Inventory Value', 'Returns'],
                datasets: [{
                    label: 'Company Performance',
                    data: [50000, 120000, 5000],
                    backgroundColor: ['#FF007F', '#D4AF37', '#000']
                }]
            }
        });
    }

    // --- UTILITIES ---
    function playNotif() { document.getElementById('notif-sound').play(); }
    
    function showToast(icon, title, msg) {
        const t = document.getElementById('success-toast');
        document.getElementById('toast-icon').innerText = icon;
        document.getElementById('toast-title').innerText = title;
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('show');
        setTimeout(() => {
            t.classList.remove('show');
            closeModules(); // Back to landing page
        }, 3000);
    }

    // [INTEGRATE REMAINING UI RENDERING LOGIC FOR TABS AND ADMIN FORMS]
    // Note: All database calls use your provided keys.
</script>
</body>
