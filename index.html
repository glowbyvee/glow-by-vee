<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow By Vee | Royal Radiance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --fuchsia: #FF007F; --gold: #D4AF37; --soft-pink: #FFF0F6; }
        body { font-family: 'Inter', sans-serif; background: #fff; scroll-behavior: smooth; }
        .royal-font { font-family: 'Cinzel', serif; }

        /* Compact Hero */
        .hero-mini {
            height: 35vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('hero-premium.jpg');
            background-size: cover;
            background-position: center;
            display: flex; align-items: center; justify-content: center;
        }

        /* Fixed Slideshows */
        .cat-card { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden; border: 4px solid var(--soft-pink); transition: 0.3s; cursor: pointer; }
        .cat-card:hover { border-color: var(--fuchsia); transform: translateY(-5px); }
        .slide-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide-img.active { opacity: 1; z-index: 10; }

        .btn-royal { background: var(--fuchsia); color: white; font-weight: 800; text-transform: uppercase; transition: 0.3s; border-radius: 12px; }
        .btn-royal:hover { background: #E60073; box-shadow: 0 10px 15px -3px rgba(255, 0, 127, 0.3); }

        /* Modal styling */
        .modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        
        #cart-sidebar { transition: transform 0.4s ease; transform: translateX(100%); z-index: 150; }
        #cart-sidebar.open { transform: translateX(0); }
    </style>
</head>
<body>

    <nav class="sticky top-0 bg-white/90 backdrop-blur-md z-[100] px-6 py-4 border-b-4 border-[#FF007F] flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" class="w-12 h-12 rounded-full border border-pink-200">
            <h1 class="royal-font text-xl md:text-3xl font-bold text-[#FF007F]">Glow By Vee</h1>
        </div>
        <div class="flex gap-6 items-center">
            <div class="relative cursor-pointer" onclick="document.getElementById('cart-sidebar').classList.add('open')">
                <span class="text-3xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-[#FF007F] text-white text-xs rounded-full px-2 font-bold">0</span>
            </div>
        </div>
    </nav>

    <header class="hero-mini">
        <h2 class="royal-font text-5xl md:text-7xl text-white drop-shadow-lg">Royal Radiance</h2>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        
        <section class="mb-20">
            <h2 class="royal-font text-3xl text-center text-[#D4AF37] mb-10">Glow By Vee's Collections</h2>
            <div id="category-container" class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-10">
                </div>

            <div class="flex flex-col md:flex-row gap-4 items-center justify-center bg-pink-50 p-6 rounded-3xl border-2 border-pink-100">
                <input type="text" id="search-input" oninput="filterByText()" placeholder="Search products (e.g. 'Serum', 'Cream')..." class="w-full md:w-1/2 p-4 rounded-xl border-2 border-pink-200 outline-none focus:border-[#FF007F] font-medium">
                <button onclick="renderProducts('All')" class="text-[#FF007F] font-bold hover:underline">Clear Filters</button>
            </div>
        </section>

        <section id="shop-section">
            <h2 class="royal-font text-3xl text-center text-[#FF007F] mb-12">Individual Products</h2>
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
                </div>
        </section>
    </main>

    <div id="detail-modal" class="modal">
        <div class="bg-white rounded-[40px] max-w-4xl w-full overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-4xl text-gray-400 hover:text-black z-10">&times;</button>
            <div class="md:w-1/2 bg-gray-100">
                <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="md:w-1/2 p-10 flex flex-col">
                <h3 id="modal-title" class="royal-font text-3xl text-[#D4AF37] mb-4"></h3>
                <p id="modal-price" class="text-2xl font-black text-[#FF007F] mb-6"></p>
                <div class="mb-6">
                    <h4 class="font-bold uppercase text-xs text-gray-400 tracking-widest mb-2">Description</h4>
                    <p id="modal-desc" class="text-gray-600 leading-relaxed"></p>
                </div>
                <div class="mb-8 flex-1 overflow-y-auto">
                    <h4 class="font-bold uppercase text-xs text-gray-400 tracking-widest mb-2">Queen Reviews</h4>
                    <div id="modal-reviews" class="space-y-3 italic text-sm text-gray-500"></div>
                </div>
                <button id="modal-add-btn" class="btn-royal w-full py-5 text-xl">Add to Bag</button>
            </div>
        </div>
    </div>

    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-2xl flex flex-col border-l-8 border-[#FF007F]">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="royal-font text-xl">Your Bag</h2>
            <button onclick="document.getElementById('cart-sidebar').classList.remove('open')" class="text-4xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t bg-pink-50">
            <div class="flex justify-between font-bold text-xl mb-4"><span>Total:</span><span id="cart-total">KES 0</span></div>
            <button class="btn-royal w-full py-4">Checkout</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://znanyxsycuhhykciwigi.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VohHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let products = [], categories = [], cart = [];

        async function loadGlowData() {
            const [cData, pData] = await Promise.all([
                _supabase.from('categories').select('*'),
                _supabase.from('products').select('*')
            ]);
            categories = cData.data || [];
            products = pData.data || [];
            renderUI();
        }

        function renderUI() {
            renderCategories();
            renderProducts('All');
            startSlideshows();
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = categories.map(cat => {
                const catImgs = products.filter(p => p.category_id === cat.id).map(p => p.image_url);
                const slides = catImgs.length > 0 
                    ? catImgs.map((img, i) => `<img src="${img}" class="slide-img ${i===0?'active':''}" data-cat="${cat.id}">`).join('')
                    : `<img src="logo.jpg" class="slide-img active">`;

                return `
                    <div class="flex flex-col items-center gap-4" onclick="renderProducts('${cat.name}')">
                        <div class="cat-card shadow-lg border-4 border-pink-50">${slides}</div>
                        <span class="royal-font font-bold text-sm text-center uppercase tracking-tighter">${cat.name}</span>
                    </div>
                `;
            }).join('');
        }

        function renderProducts(filter) {
            const grid = document.getElementById('product-grid');
            let filtered = products;

            if (filter !== 'All') {
                filtered = products.filter(p => {
                    const c = categories.find(cat => cat.id === p.category_id);
                    return c && c.name === filter;
                });
            }

            grid.innerHTML = filtered.map(p => `
                <div class="group bg-white rounded-[30px] p-6 shadow-md border border-gray-100 hover:border-[#FF007F] transition-all">
                    <div class="overflow-hidden rounded-2xl mb-4 cursor-pointer" onclick="openModal(${p.id})">
                        <img src="${p.image_url}" class="w-full aspect-square object-cover group-hover:scale-110 transition-transform duration-500">
                    </div>
                    <h3 class="royal-font text-lg font-bold text-gray-800">${p.name}</h3>
                    <p class="text-[#FF007F] font-black text-xl mb-4">KES ${p.price.toLocaleString()}</p>
                    <button onclick="addToCart(${p.id})" class="btn-royal w-full py-3 text-sm">Add to Bag</button>
                </div>
            `).join('');
        }

        function filterByText() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            const grid = document.getElementById('product-grid');
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-[30px] p-6 shadow-md border border-gray-100 flex flex-col">
                    <img src="${p.image_url}" class="w-full aspect-square object-cover rounded-2xl mb-4 cursor-pointer" onclick="openModal(${p.id})">
                    <h3 class="royal-font text-lg font-bold">${p.name}</h3>
                    <p class="text-[#FF007F] font-black text-xl mb-4">KES ${p.price.toLocaleString()}</p>
                    <button onclick="addToCart(${p.id})" class="btn-royal w-full py-3">Add to Bag</button>
                </div>
            `).join('');
        }

        function openModal(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('modal-img').src = p.image_url;
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-price').innerText = `KES ${p.price.toLocaleString()}`;
            document.getElementById('modal-desc').innerText = p.description || "Indulge in royal care with this premium Glow By Vee formula. Crafted for radiance and skin health.";
            
            // Mock reviews for professional feel
            const reviews = ["'Absolutely transformed my skin!' - Sarah M.", "'The glow is real. Best purchase this year.' - Joyce K."];
            document.getElementById('modal-reviews').innerHTML = reviews.map(r => `<p>${r}</p>`).join('');
            
            document.getElementById('modal-add-btn').onclick = () => { addToCart(p.id); closeModal(); };
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('detail-modal').classList.remove('active'); }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            cart.push(p);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = `KES ${cart.reduce((sum, item) => sum + item.price, 0).toLocaleString()}`;
            document.getElementById('cart-items').innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border-b border-pink-100">
                    <div>
                        <p class="font-bold text-xs uppercase">${item.name}</p>
                        <p class="text-[#FF007F] text-xs">KES ${item.price}</p>
                    </div>
                    <button onclick="cart.splice(${idx}, 1); updateCartUI()" class="text-red-300 text-xl">&times;</button>
                </div>
            `).join('');
        }

        function startSlideshows() {
            categories.forEach(cat => {
                const slides = document.querySelectorAll(`[data-cat="${cat.id}"]`);
                if (slides.length > 1) {
                    let cur = 0;
                    setInterval(() => {
                        slides[cur].classList.remove('active');
                        cur = (cur + 1) % slides.length;
                        slides[cur].classList.add('active');
                    }, 3000);
                }
            });
        }

        window.onload = loadGlowData;
    </script>
</body>
</html>
