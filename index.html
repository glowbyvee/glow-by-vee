<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow By Vee | Royal Radiance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --fuchsia: #FF007F; --gold: #D4AF37; }
        body { font-family: 'Inter', sans-serif; background: #fff; scroll-behavior: smooth; }
        .royal-font { font-family: 'Cinzel', serif; }
        
        /* High-Speed Slideshow CSS */
        .cat-slideshow { position: absolute; inset: 0; width: 100%; height: 100%; background: #f3f4f6; }
        .cat-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; object-fit: cover; }
        .cat-slide.active { opacity: 1; z-index: 1; }

        .btn-glow { background: var(--fuchsia); color: white; font-weight: 900; transition: 0.3s; text-transform: uppercase; }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255, 0, 127, 0.3); }
        
        .modal-overlay { background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 100; }
        .modal-overlay.active { display: flex; }
        
        #success-toast {
            visibility: hidden; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; border: 4px solid var(--fuchsia); padding: 2rem; border-radius: 2rem; z-index: 1000;
        }
        #success-toast.show { visibility: visible; animation: pop 0.4s ease-out; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.5); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

    <nav class="sticky top-0 bg-white z-50 p-6 border-b-4 border-[#FF007F] flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" class="w-12 h-12 rounded-full">
            <h1 class="royal-font text-2xl font-bold text-[#FF007F]">Glow By Vee</h1>
        </div>
        <div class="flex gap-6 items-center font-bold text-[#D4AF37]">
            <a href="#catalog">SHOP</a>
            <button onclick="document.getElementById('admin-modal').classList.add('active')">ADMIN</button>
            <div class="relative cursor-pointer" onclick="document.getElementById('cart-sidebar').style.transform='translateX(0)'">
                <span class="text-3xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-[#FF007F] text-white text-xs rounded-full px-2">0</span>
            </div>
        </div>
    </nav>

    <div id="success-toast" class="text-center">
        <h2 class="royal-font text-2xl text-[#FF007F] mb-2">Glow Added!</h2>
        <p class="font-bold">Item added to your bag.</p>
    </div>

    <section id="catalog" class="py-20 px-6 max-w-7xl mx-auto">
        <h2 class="royal-font text-4xl text-center text-[#D4AF37] mb-12">Our Collections</h2>
        <div id="category-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-24">
            </div>

        <h2 class="royal-font text-4xl text-center text-[#FF007F] mb-12">All Products</h2>
        <div id="product-container" class="grid grid-cols-1 md:grid-cols-3 gap-12">
            </div>
    </section>

    <div id="admin-modal" class="modal-overlay">
        <div class="bg-white p-10 rounded-3xl max-w-sm w-full text-center">
            <h2 class="royal-font text-2xl mb-6">Admin Login</h2>
            <input type="password" id="admin-key" placeholder="Enter Admin Key" class="w-full p-4 border rounded-xl mb-4 text-center">
            <button onclick="checkAdmin()" class="btn-glow w-full py-4 rounded-xl">Access Dashboard</button>
            <button onclick="this.parentElement.parentElement.classList.remove('active')" class="mt-4 text-gray-400 text-sm">Close</button>
        </div>
    </div>

    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-2xl z-[100] transition-transform translate-x-full border-l-8 border-[#FF007F] flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <h2 class="royal-font text-xl">Your Bag</h2>
            <button onclick="document.getElementById('cart-sidebar').style.transform='translateX(100%)'" class="text-3xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t">
            <div class="flex justify-between font-black text-xl mb-4"><span>Total:</span><span id="cart-total">KES 0</span></div>
            <button class="btn-glow w-full py-4 rounded-xl">Checkout</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://znanyxsycuhhykciwigi.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuYW55eHN5Y3VohHlrY2l3aWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg2ODcsImV4cCI6MjA5MDcyNDY4N30.yD3lulYttBU90u3jt4LUVVUeW53vGT9Em9W2YaZFkdA";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let products = [];
        let categories = [];
        let cart = [];

        async function loadData() {
            // Fetch everything at once for speed
            const [catRes, prodRes] = await Promise.all([
                _supabase.from('categories').select('*'),
                _supabase.from('products').select('*')
            ]);

            categories = catRes.data || [];
            products = prodRes.data || [];

            renderCategories();
            renderProducts();
            startSlideshows();
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            if (categories.length === 0) {
                container.innerHTML = `<p class='text-center col-span-full opacity-50'>No categories found in Supabase.</p>`;
                return;
            }

            container.innerHTML = categories.map(cat => {
                // Find all products that belong to this category ID
                const catImages = products
                    .filter(p => p.category_id === cat.id)
                    .map(p => p.image_url);

                // Create the slide HTML - if no images, use logo
                let slidesHtml = catImages.length > 0 
                    ? catImages.map((img, i) => `<img src="${img}" class="cat-slide ${i === 0 ? 'active' : ''}" data-cat="${cat.id}">`).join('')
                    : `<img src="logo.jpg" class="cat-slide active">`;

                return `
                    <div class="relative h-64 rounded-3xl overflow-hidden shadow-lg group cursor-pointer">
                        <div class="cat-slideshow">${slidesHtml}</div>
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center group-hover:bg-black/20 transition-all">
                            <h3 class="royal-font text-white text-xl font-bold uppercase tracking-widest">${cat.name}</h3>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-3xl shadow-md p-4 border border-gray-100 hover:border-[#FF007F] transition-all">
                    <img src="${p.image_url}" class="w-full aspect-square object-cover rounded-2xl mb-4">
                    <h3 class="royal-font text-lg font-bold">${p.name}</h3>
                    <p class="text-[#FF007F] font-black text-xl mb-4">KES ${p.price.toLocaleString()}</p>
                    <button onclick="addToBag(${p.id}, '${p.name.replace(/'/g, "")}', ${p.price})" class="btn-glow w-full py-3 rounded-xl text-sm">Add to Bag</button>
                </div>
            `).join('');
        }

        function startSlideshows() {
            categories.forEach(cat => {
                const slides = document.querySelectorAll(`[data-cat="${cat.id}"]`);
                if (slides.length > 1) {
                    let current = 0;
                    setInterval(() => {
                        slides[current].classList.remove('active');
                        current = (current + 1) % slides.length;
                        slides[current].classList.add('active');
                    }, 3000);
                }
            });
        }

        function addToBag(id, name, price) {
            cart.push({ id, name, price });
            updateCart();
            const toast = document.getElementById('success-toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = `KES ${cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
            document.getElementById('cart-items').innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <span class="text-xs font-bold">${item.name}</span>
                    <button onclick="cart.splice(${idx}, 1); updateCart()" class="text-red-400">&times;</button>
                </div>
            `).join('');
        }

        function checkAdmin() {
            if (document.getElementById('admin-key').value === 'VEEROYAL254') {
                alert("Access Granted. Redirecting to Management...");
                // You can point this to your admin page
            } else {
                alert("Invalid Key");
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
